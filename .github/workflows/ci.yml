name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,reports,ml]"

      - name: Run tests with coverage
        run: pytest --tb=short -q --cov=openpkflow --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          flags: ${{ matrix.python-version }}

      - name: Check types
        run: mypy src/openpkflow --ignore-missing-imports
        continue-on-error: true

  lint:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  benchmark:
    name: Benchmark (Python 3.12)
    runs-on: ubuntu-latest
    # Only run on pushes to main and on PRs; skip draft PRs
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,reports,ml]"

      - name: Run benchmarks
        run: |
          pytest tests/test_benchmark.py \
            --benchmark-only \
            --benchmark-json=benchmark.json \
            --benchmark-sort=mean \
            --benchmark-columns=min,mean,stddev,rounds,iterations

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark.json
          retention-days: 90

      - name: Store benchmark result (main only)
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: pytest
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Alert when a benchmark is 20% slower than the stored baseline
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: dev/bench
