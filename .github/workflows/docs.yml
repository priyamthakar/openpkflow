name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# This workflow uses mkdocs gh-deploy to push to the gh-pages branch.
# REQUIRED: Enable GitHub Pages in repo Settings > Pages:
#   - Source: Deploy from a branch
#   - Branch: gh-pages (root)

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install mkdocs-material

      - run: mkdocs gh-deploy --force
