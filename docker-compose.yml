# docker-compose.yml for OpenPKFlow local development
#
# Default: Jupyter Lab with the library installed (root Dockerfile).
#   docker compose up -d
#   Open http://localhost:8888
#
# Optional stack (API + webapp) -- uncomment the services below when you need
# the FastAPI adapter and Vite UI together.  Requires Node on the host for a
# simple webapp dev mount, or build a static webapp image separately.
#
#   docker compose --profile full up -d
#
# API alone (without compose profile):
#   docker build -t openpkflow-api -f api/Dockerfile .
#   docker run --rm -p 8000:8000 openpkflow-api
#
# Webapp alone (host Node):
#   cd webapp && npm install && npm run dev
#   Vite proxies /api to http://localhost:8000 (see webapp/README.md)

services:
  openpkflow:
    build: .
    image: openpkflow:latest
    container_name: openpkflow
    ports:
      - "8888:8888"
    volumes:
      - ./examples:/workspace/examples
      - ./src:/workspace/src
    environment:
      - JUPYTER_ENABLE_LAB=yes

  # --- Optional: REST API adapter (profile: full) ---
