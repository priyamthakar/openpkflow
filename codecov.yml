coverage:
  range: 70..95
  round: down
  precision: 1
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: false
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: false

comment:
  layout: diff, flags, files
  behavior: default
  require_changes: false

flags:
  "3.10":
    carryforward: false
  "3.11":
    carryforward: false
  "3.12":
    carryforward: false
