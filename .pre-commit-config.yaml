repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^scripts/conda-forge/
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: \.html$|\.csv$|\.json$
      - id: trailing-whitespace
        exclude: \.html$|\.csv$|\.json$
      - id: mixed-line-ending
        exclude: \.html$|\.csv$|\.json$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --follow-imports=silent]
        # Scope to bayes/ module (clean, typed). Full-codebase mypy runs in CI with
        # continue-on-error; pre-existing issues in older modules tracked separately.
        files: ^src/openpkflow/bayes/
        additional_dependencies:
          # numpy>=2.3 ships stubs with PEP 695 `type` statements; mypy 1.13
          # cannot parse them at the configured target version. Pin until the
          # mirrors-mypy rev is bumped.
          - numpy>=1.24,<2.3
          - pandas>=2.0
          - scipy>=1.10
          - matplotlib>=3.7
          - pydantic>=2.0
          - typer>=0.12
