                <CIBar lo={be.lo} hi={be.hi} gmr={be.gmr} pass={be.pass} />
                <div className="legend" style={{ marginTop: 6, justifyContent: "center", gap: 22 }}>
                  <span className="legend-item"><span style={{ width: 12, height: 12, background: "var(--success)", opacity: 0.25, display: "inline-block" }}></span>Acceptance zone</span>
                  <span className="legend-item"><span className="legend-swatch" style={{ background: be.pass ? "var(--success)" : "var(--danger)", height: 8 }}></span>90% CI</span>
                  <span className="legend-item"><span className="legend-swatch" style={{ background: "#fff", height: 12, width: 2 }}></span>GMR</span>
                </div>
              </div>
            </div>

            {/* metric row */}
            <div className="hscroll stagger" style={{ marginTop: 18 }}>
              <MetricCard label="GMR (T/R)" value={fmt(be.gmr, 4)} tone={be.pass ? "green" : "danger"} delay={0} />
              <MetricCard label="CI lower" value={fmt(be.lo, 4)} tone="blue" delay={40} />
              <MetricCard label="CI upper" value={fmt(be.hi, 4)} tone="blue" delay={80} />
              <MetricCard label="CV% intra" value={fmt(be.cvIntra, 1)} unit="%" tone="warm" delay={120} />
              <MetricCard label="n subjects" value={be.n} tone="dim" delay={160} />
            </div>

            {/* subject table */}
            <div style={{ marginTop: 18 }}>
              <div className="section-label">Per-subject log-difference</div>
              <div className="tbl-wrap">
                <table className="data">
                  <thead><tr>{["Subject", "Sequence", "Reference", "Test", "Ratio T/R", "ln(T/R)"].map((h) => <th key={h}>{h}</th>)}</tr></thead>
                  <tbody>
                    {be.rows.map((row) => {
                      const within = row.ratio >= 0.8 && row.ratio <= 1.25;
                      return (
                        <tr key={row.s}>
                          <td>{row.s}</td><td>{row.seq}</td>
                          <td>{row.R}</td><td>{row.T}</td>
                          <td style={{ background: within ? "rgba(63,185,80,0.08)" : "rgba(248,81,73,0.08)", color: within ? "var(--success)" : "var(--danger)" }}>{fmt(row.ratio, 4)}</td>
                          <td>{fmt(row.diff, 4)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>

            <ReportBar report={report} />
            <Disclaimer />
          </React.Fragment>
        )}
      </div>
    </AnalysisShell>
  );
}

const { useState: useStateS, useMemo: useMemoS, useEffect: useEffectS, useRef: useRefS } = React;

function Slider({ label, val, min, max, step, unit, onChange }) {
  return (
    <div className="slider-row">
      <div className="slider-head">
        <span className="sl-label">{label}</span>
        <span className="sl-val">{val}{unit ? " " + unit : ""}</span>
      </div>
      <input type="range" className="sl" min={min} max={max} step={step} value={val}
             onChange={(e) => onChange(+e.target.value)}
             style={{ background: `linear-gradient(to right, var(--accent) ${((val - min) / (max - min)) * 100}%, var(--border) ${((val - min) / (max - min)) * 100}%)` }} />
      <div className="slider-range">{min} – {max}</div>
    </div>
  );
}

function SimPage() {
  const [model, setModel] = useStateS("1cmt");
  const [route, setRoute] = useStateS("oral");
  const [dose, setDose] = useStateS(250);
  const [CL, setCL] = useStateS(8);
  const [V, setV] = useStateS(45);
  const [Ka, setKa] = useStateS(1.2);
  const [Q, setQ] = useStateS(5);
  const [Vp, setVp] = useStateS(35);
  const [tau, setTau] = useStateS(12);
  const [nDoses, setNDoses] = useStateS(4);
  const [scale, setScale] = useStateS("linear");

  // debounced params
  const [params, setParams] = useStateS({ model, route, dose, CL, V, Ka, Q, Vp, tau, nDoses });
  const tref = useRefS(null);
  useEffectS(() => {
    clearTimeout(tref.current);
    tref.current = setTimeout(() => setParams({ model, route, dose, CL, V, Ka, Q, Vp, tau, nDoses, tinf: 1 }), 90);
    return () => clearTimeout(tref.current);
  }, [model, route, dose, CL, V, Ka, Q, Vp, tau, nDoses]);

  const sim = useMemoS(() => simulate(params), [params]);
  const simReport = useMemoS(() => {
    const step = Math.max(1, Math.round(sim.curve.length / 40));
    const sampled = sim.curve.filter((_, i) => i % step === 0);
    const routeLabel = route === "oral" ? "Oral" : route === "bolus" ? "IV bolus" : "IV infusion";
    return {
      module: "SIMULATION", reportId: reportId("SIM"), generated: TODAY,
      title: "PK Simulation",
      subtitle: `${model === "1cmt" ? "One" : "Two"}-compartment ${routeLabel.toLowerCase()} model · ${nDoses}× ${dose} mg q${tau}h`,
      meta: [
        ["Model", (model === "1cmt" ? "1-compartment" : "2-compartment")],
        ["Route", routeLabel],
        ["Dose regimen", `${dose} mg × ${nDoses}, τ = ${tau} h`],
        ["CL / Vz", `${CL} L/h / ${V} L`],
        ["Solver", "4th-order Runge–Kutta"],
      ],
      sections: [
        { type: "metrics", title: "Exposure metrics", items: [
          { label: "Cmax", value: fmt(sim.cmax, 2), unit: "mg/L", tone: "warm" },
          { label: "Tmax", value: fmt(sim.tmax, 2), unit: "h" },
          { label: "Cmin,ss", value: fmt(sim.cmin, 3), unit: "mg/L", tone: "blue" },
          { label: "Clast", value: fmt(sim.clast, 3), unit: "mg/L", tone: "green" },
          { label: "ke", value: fmt(CL / V, 4), unit: "h⁻¹" },
        ] },
        { type: "table", title: "Simulated concentration–time profile",
          columns: ["Time (h)", "Conc (mg/L)"],
          rows: sampled.map((p) => [fmt(p.t, 2), fmt(p.c, 3)]) },
        { type: "text", title: "Interpretation",
          body: `Forward simulation of a ${model === "1cmt" ? "one" : "two"}-compartment ${routeLabel.toLowerCase()} model predicts a peak concentration of ${fmt(sim.cmax, 2)} mg/L at ${fmt(sim.tmax, 2)} h. Over the ${nDoses}-dose regimen (τ = ${tau} h) the trough within the final interval reaches ${fmt(sim.cmin, 3)} mg/L. Parameters: CL = ${CL} L/h, Vz = ${V} L${route === "oral" ? ", Ka = " + Ka + " h⁻¹" : ""}${model === "2cmt" ? ", Q = " + Q + " L/h, Vp = " + Vp + " L" : ""}.` },
      ],
      disclaimer: "Generated by OpenPKFlow (open-source, MIT). Not a regulatory tool. Results require review by qualified pharmacokinetic and regulatory experts before any regulatory use.",
    };
  }, [sim, params]);
  const data = sim.curve.filter((d) => scale === "linear" || d.c > 1e-3).map((d) => ({ x: +d.t.toFixed(2), y: d.c }));
  const doseLines = sim.doseTimes.slice(1).map((t) => ({ x: t, color: "var(--accent-warm)" }));
  const annotations = sim.cmax > 0 ? [{ x: +sim.tmax.toFixed(2), y: sim.cmax, label: "Cmax " + fmt(sim.cmax, 2), color: "var(--accent-warm)" }] : [];

  return (
    <AnalysisShell>
      <div className="panel-left">
        <div className="field" style={{ marginBottom: 16 }}>
          <span className="label-xs">Model</span>
          <div className="pill-group" style={{ marginTop: 6 }}>
            <button className={"pill" + (model === "1cmt" ? " active" : "")} onClick={() => setModel("1cmt")} style={{ flex: 1 }}>1-Compartment</button>
            <button className={"pill" + (model === "2cmt" ? " active" : "")} onClick={() => setModel("2cmt")} style={{ flex: 1 }}>2-Compartment</button>
          </div>
        </div>
        <div className="field" style={{ marginBottom: 20 }}>
          <span className="label-xs">Route</span>
          <div className="pill-group" style={{ marginTop: 6 }}>
            {[["oral", "Oral"], ["bolus", "IV Bolus"], ["infusion", "IV Infusion"]].map(([k, l]) => (
              <button key={k} className={"pill" + (route === k ? " active" : "")} onClick={() => setRoute(k)} style={{ flex: 1, padding: "6px 6px" }}>{l}</button>
            ))}
          </div>
        </div>

        <div className="section-label">Parameters</div>
        <Slider label="Dose" val={dose} min={10} max={1000} step={10} unit="mg" onChange={setDose} />
        <Slider label="CL" val={CL} min={0.5} max={50} step={0.5} unit="L/h" onChange={setCL} />
        <Slider label="Vz" val={V} min={5} max={200} step={5} unit="L" onChange={setV} />
        {route === "oral" && <div className="slide-in"><Slider label="Ka" val={Ka} min={0.1} max={5} step={0.1} unit="h⁻¹" onChange={setKa} /></div>}
        {model === "2cmt" && (
          <div className="slide-in">
            <Slider label="Q" val={Q} min={0.5} max={30} step={0.5} unit="L/h" onChange={setQ} />
            <Slider label="Vp" val={Vp} min={5} max={150} step={5} unit="L" onChange={setVp} />
          </div>
        )}
        <div className="section-label" style={{ marginTop: 18 }}>Dosing regimen</div>
        <Slider label="tau (interval)" val={tau} min={4} max={24} step={1} unit="h" onChange={setTau} />
        <Slider label="n doses" val={nDoses} min={1} max={20} step={1} onChange={setNDoses} />
      </div>

      <div className="panel-right">
        <div className="chart-card">
          <div className="chart-head">
            <span className="chart-title">Concentration–time · {model === "1cmt" ? "1-cmt" : "2-cmt"} {route}</span>
            <div className="pill-ghost-group">
              <button className={"pill-ghost" + (scale === "linear" ? " active" : "")} onClick={() => setScale("linear")}>Linear</button>
              <button className={"pill-ghost" + (scale === "log" ? " active" : "")} onClick={() => setScale("log")}>Semi-log</button>
            </div>
          </div>
          <LineChart log={scale === "log"}
            series={[{ data, color: "var(--accent)", name: "Conc", width: 2 }]}
            xLabel="Time (h)" yLabel="Conc (mg/L)" height={340}
            refLines={doseLines} annotations={annotations} />
        </div>

        <div className="hscroll" style={{ marginTop: 18 }}>
          <MetricCard label="Cmax" value={fmt(sim.cmax, 2)} unit="mg/L" tone="warm" />
          <MetricCard label="Tmax" value={fmt(sim.tmax, 2)} unit="h" tone="dim" />
          <MetricCard label="Cmin,ss" value={fmt(sim.cmin, 3)} unit="mg/L" tone="blue" />
          <MetricCard label="Clast" value={fmt(sim.clast, 3)} unit="mg/L" tone="green" />
          <MetricCard label="ke" value={fmt(CL / V, 4)} unit="h⁻¹" tone="dim" />
        </div>

        <div className="warnbox" style={{ marginTop: 18 }}>
          <Icon name="info" size={16} />
          <span>Curve updates live as you move the sliders — solved by 4th-order Runge–Kutta integration of the {model === "1cmt" ? "one" : "two"}-compartment {route} model with superposition across {nDoses} dose{nDoses > 1 ? "s" : ""}.</span>
        </div>

        <ReportBar report={simReport} />
        <Disclaimer />
      </div>
    </AnalysisShell>
  );
}

  const testData = DISS_TIMES.map((t, i) => ({ x: t, y: DISS_FORMS[test][i] }));

  const uploadGrid = [
    ["REF", "A", "10", "22"], ["REF", "A", "20", "58"],
    ["TEST", "1", "10", "18"], ["TEST", "1", "20", "51"],
  ];
  const [grid, setGrid] = useStateD(uploadGrid);

  return (
    <AnalysisShell>
      <div className="panel-left">
        <div className="stepper">
          <Step n="1" title="Data input" active done>
            <div className="pill-group" style={{ marginBottom: 12 }}>
              <button className="pill active">Paste table</button>
              <button className="pill">Upload CSV</button>
            </div>
            <PasteGrid columns={["Form", "Batch", "Time", "%Rel"]} rows={grid} onChange={setGrid} maxHeight={240} />
          </Step>
          <Step n="2" title="Select profiles" active>
            <div className="field-row">
              <label>Reference</label>
              <select className="inp" value={ref} onChange={(e) => setRef(e.target.value)}>
                {forms.map((f) => <option key={f}>{f}</option>)}
              </select>
            </div>
            <div className="field-row">
              <label>Test</label>
              <select className="inp" value={test} onChange={(e) => setTest(e.target.value)}>
                {forms.map((f) => <option key={f}>{f}</option>)}
              </select>
            </div>
          </Step>
        </div>
        <div style={{ marginTop: 20 }}><RunButton label="Compute f2" loading={loading} onClick={run} /></div>
      </div>

      <div className="panel-right">
        {!hasRun ? (
          <EmptyState icon="waves" hint="Load dissolution profiles, then select reference and test formulations." />
        ) : (
          <React.Fragment key={runKey}>
            {/* f2 headline card */}
            <div style={{ display: "flex", gap: 18, alignItems: "stretch" }}>
              <div className={"metric-card " + (res.similar ? "mc-green" : "mc-danger")} style={{ width: 220, padding: "16px 18px" }}>
                <div className="mc-label">f2 similarity factor</div>
                <div style={{ marginTop: 4 }}><span className="mc-value" style={{ fontSize: 48 }}>{fmt(res.f2, 1)}</span></div>
                <div style={{ fontFamily: "var(--font-mono)", fontSize: 13, marginTop: 8, color: res.similar ? "var(--success)" : "var(--danger)", letterSpacing: "0.08em" }}>
                  {res.similar ? "SIMILAR" : "NOT SIMILAR"}
                </div>
                <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--text-dim)", marginTop: 6 }}>f1 = {fmt(res.f1, 2)}</div>
              </div>
              <div className="hscroll stagger" style={{ flex: 1 }}>
                <MetricCard label="f2" value={fmt(res.f2, 1)} tone={res.similar ? "green" : "danger"} delay={0} />
                <MetricCard label="f1" value={fmt(res.f1, 2)} tone="blue" delay={40} />
                <MetricCard label="timepoints" value={res.n} tone="dim" delay={80} />
                <MetricCard label="threshold" value="50" tone="dim" delay={120} sub="f2 ≥ 50 = similar" />
              </div>
            </div>

            {/* chart */}
            <div className="chart-card" style={{ marginTop: 18 }}>
              <div className="chart-head"><span className="chart-title">Dissolution profiles</span></div>
              <LineChart series={[
                { data: refData, color: "var(--accent)", name: "Reference", width: 2 },
                { data: testData, color: "var(--accent-warm)", name: "Test", dashed: true, width: 2 },
              ]} xLabel="Time (min)" yLabel="% Released" height={300} yDomain={[0, 100]}
                 hRefLines={[{ y: 85, color: "var(--text-dim)", label: "85% reference point" }]} />
              <div className="legend" style={{ padding: "4px 0 8px" }}>
                <span className="legend-item"><span className="legend-swatch" style={{ background: "var(--accent)" }}></span>{ref}</span>
                <span className="legend-item"><span className="legend-swatch" style={{ background: "var(--accent-warm)" }}></span>{test}</span>
              </div>
            </div>

            {!res.similar && (
              <div className="warnbox" style={{ marginTop: 16 }}>
                <Icon name="alert" size={16} />
                <span>Profiles are <strong style={{ color: "var(--accent-warm)" }}>NOT similar</strong> (f2 &lt; 50). Review formulation differences before regulatory submission.</span>
              </div>
            )}

            <ReportBar report={dReport} />
            <Disclaimer />
          </React.Fragment>
        )}
      </div>
    </AnalysisShell>
  );
}

Object.assign(window, { DissolutionPage });

/* ============================================================
   OpenPKFlow — app shell: router + theme + tweaks
   ============================================================ */
const { useState: useStateA, useEffect: useEffectA } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#58a6ff",
  "density": "regular",
  "gridTexture": 0.03,
  "heroSerif": true
}/*EDITMODE-END*/;

const ACCENT_OPTIONS = ["#58a6ff", "#38bdf8", "#3fb950", "#f0a731", "#c084fc"];
const hexToRgb = (h) => {
  const n = parseInt(h.slice(1), 16);
  return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
};

const TITLES = {
  home: ["OPENPKFLOW", "pharmacometric analysis platform"],
  nca: ["NCA", "non-compartmental analysis"],
  dissolution: ["DISSOLUTION", "f1 / f2 profile comparison"],
  simulation: ["SIMULATION", "compartmental PK forward modeling"],
  ivivc: ["IVIVC", "in vitro–in vivo correlation"],
  be: ["BIOEQUIVALENCE", "average BE · two one-sided tests"],
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useStateA("home");
  const [theme, setTheme] = useStateA("dark");
  const [navOpen, setNavOpen] = useStateA(false);
  const [collapsed, setCollapsed] = useStateA(false);
  const [report, setReport] = useStateA(null);

  // register a global opener so any screen's ReportBar can launch the modal
  useEffectA(() => { window.__openReport = setReport; return () => { delete window.__openReport; }; }, []);

  // apply theme
  useEffectA(() => { document.documentElement.setAttribute("data-theme", theme); }, [theme]);

  // apply tweaks -> CSS vars
  useEffectA(() => {
    const root = document.documentElement;
    root.style.setProperty("--accent", t.accent);
    root.style.setProperty("--accent-rgb", hexToRgb(t.accent));
    root.style.setProperty("--grid-opacity", String(t.gridTexture));
    root.setAttribute("data-hero", t.heroSerif ? "serif" : "sans");
  }, [t.accent, t.gridTexture, t.heroSerif]);

  const nav = (id) => { setPage(id); setNavOpen(false); window.scrollTo(0, 0); };
  const [title, subtitle] = TITLES[page];

  return (
    <React.Fragment>
    <div className="app app-texture">
      <Sidebar active={page} onNav={nav} open={navOpen}
               collapsed={collapsed} onToggleCollapse={() => setCollapsed((c) => !c)} />
      <div className="main">
        <TopBar title={title} subtitle={subtitle} theme={theme}
                onToggleTheme={() => setTheme(theme === "dark" ? "light" : "dark")}
                onMenu={() => setNavOpen(!navOpen)} />
        {page === "home" ? <HomePage onNav={nav} /> : (
          <div className="content" style={{ display: "flex" }}>
            {page === "nca" && <NCAPage />}
            {page === "be" && <BEPage />}
            {page === "ivivc" && <IVIVCPage />}
            {page === "simulation" && <SimPage />}
            {page === "dissolution" && <DissolutionPage />}
          </div>
        )}
      </div>

      <TweaksPanel>
        <TweakSection label="Identity" />
        <TweakColor label="Accent" value={t.accent}
          options={ACCENT_OPTIONS}
          onChange={(v) => setTweak("accent", v)} />
        <TweakToggle label="Serif hero headline" value={t.heroSerif}
          onChange={(v) => setTweak("heroSerif", v)} />
        <TweakSection label="Texture" />
        <TweakSlider label="Dot-grid texture" value={t.gridTexture} min={0} max={0.1} step={0.01}
          onChange={(v) => setTweak("gridTexture", v)} />
      </TweaksPanel>
    </div>
    <ReportModal report={report} onClose={() => setReport(null)} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
